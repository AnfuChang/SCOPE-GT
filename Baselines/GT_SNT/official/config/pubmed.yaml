shared:
  runs: 1
  epochs: 1000
  eval_step: 50
  patience: 200
  seed: 123
dataset:
  name: Pubmed
  data_dir: ./data
  metric_type: accuracy
opt:
  lr: 0.001
  wd: 0.01
  loss_func: cross_entropy
model:
  hid_channels: 256
  cb_channels: 8
  num_layers: 2
  num_heads: 4
  T: 3
  neuron: PLIF
  v_threshold: 0.6
  v_reset: 0.0
  dropout: 0.2
  attn_dropout: 0.8
  coding_type: default
  maximum_codes_num: null
  normalize: False
  enable_residual: False
  enable_norm: False